[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chitchat"
version = "1.1.0"
description = "ChitChat - Peer-to-peer encrypted chat"
readme = "README.md"
license = {text = "Apache License, Version 2.0"}
requires-python = ">=3.10"
dependencies = [
    "websockets",
    "zeroconf",
    "cryptography",
    "pycryptodome",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[project.scripts]
chitchat = "core.daemon:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
