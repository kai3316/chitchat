name: chitchat
description: Modern multi-platform chat application
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  provider: ^6.1.0
  intl: ^0.19.0
  image_picker: ^1.0.0
  file_picker: ^6.0.0
  record: ^5.0.0
  audioplayers: ^5.0.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 700
